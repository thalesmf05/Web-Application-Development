<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Sport Favourites</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="title">
            <h1>My Sport Favourites</h1>
        </div>

        <p class="intro">
            Tell us about your favourity sport and your experiences
        </p>

        <form>

            <label for="favouriteArtist">
                Favourite Sport
            </label>

            <input 
                type="text" 
                id="favouriteArtist" 
                name="favouriteArtist"
                placeholder="e.g. Swimming"
                required
            >


            <label for="recommendedArtist">
                Player / Athlete you like 
            </label>

            <input 
                type="text" 
                id="recommendedArtist" 
                name="recommendedArtist"
                placeholder="e.g. Michael Phelps"
            >


            <label for="favouriteSong">
                Favourite part of the sport you like
            </label>

            <input 
                type="text" 
                id="favouriteSong" 
                name="favouriteSong"
                placeholder="e.g. Fellowship with other athlets"
                required
            >


            <label for="bestGig">
                Best event / race that you have attended
            </label>

            <input 
                type="text" 
                id="bestGig" 
                name="bestGig"
                placeholder="e.g. Paris 2024 Olympics"
            >


            <label for="comments">
                Why was it your favourite?
            </label>

            <textarea 
                id="comments" 
                name="comments"
                rows="5"
                placeholder="Tell us a little more..."
            ></textarea>


            <button type="submit">
                Submit My Sport
            </button>

        </form>

    </div>

</body>
</html>
