<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Weather App</title>
        <link rel="stylesheet" href="css/style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <!-- logo and brand name -->
                <a class="navbar-brand" href="weather.html">
                    <i class="bi-cloud-sun"></i>
                    Weather App
                </a>
                <!-- navigation links -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0 nav-underline">
                        <li class="nav-item"><a class="nav-link" aria-current="page" href="index.html">Clothes Shop</a></li>
                        <li class="nav-item"><a class="nav-link active" aria-current="page" href="weather.html">Weather API</a></li>
                    </ul>
                    
                </div>
            </div>
        </nav>

        <div class="container mt-5 text-center">
            <h1>Welcome to the Weather App</h1>
            <p>Get the latest weather updates and forecasts.</p>

            <!-- search section -->
            <p>Search for a location:</p>
            <form id="weather-form" class="hstack gap-2 search-form mx-auto" role="search">
                <input id="search-input" class="form-control" type="search" placeholder="Enter city name" aria-label="Search"/>
                <button class="btn-solid btn-icon theme-secondary w-auto flex-shrink-0" type="submit" aria-label="Search">
                    <i class="bi bi-search" aria-hidden="true"></i>
                </button>
            </form>

            <!-- result section -->
            <div id="weather-results" class="d-block gap-4 p-3 rounded-4 align-items-start mt-5 justify-content-center">
                <!-- Results will be inserted here -->
            </div>

        </div>

        <script src="scripts.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
